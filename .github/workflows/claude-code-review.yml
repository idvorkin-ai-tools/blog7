name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    # Skip bot's own PRs — only review external/human contributions
    if: github.event.pull_request.user.login != 'idvorkin-ai-tools'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          # OAuth token — switch to anthropic_api_key when ready:
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a blog repository (Jekyll + markdown). Focus on what matters for this codebase:

            **Content checks:**
            - Internal links use permalinks, not redirect URLs (e.g., `/voices` not `/voices-in-my-head`)
            - ai-slop label is placed AFTER the first paragraph, not before or inside it
            - Frontmatter is well-formed (valid YAML, required fields present)

            **Code checks (if applicable):**
            - JavaScript/HTML changes follow existing patterns
            - No broken includes or Liquid template errors
            - Build won't break

            Use the repository's CLAUDE.md for full guidance on style and conventions.

            Note: The PR branch is already checked out in the current working directory.

            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) to highlight specific issues on individual lines.
            Use `gh pr comment` for top-level summary feedback.
            Only post GitHub comments — don't submit review text as messages.

          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'
