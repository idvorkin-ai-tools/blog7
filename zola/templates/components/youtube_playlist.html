{% component youtube_playlist(list, autoplay=None, index=None) -%}
<div class="ratio ratio-16x9">
<iframe
class="embed-responsive-item"
src="https://www.youtube.com/embed/videoseries?list={{ list }}&loop=1&rel=0{% if autoplay %}&autoplay=1&mute=1{% endif %}{% if index %}&index={{ index }}{% endif %}"
allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
allowfullscreen
></iframe>
</div>
{%- endcomponent youtube_playlist %}
