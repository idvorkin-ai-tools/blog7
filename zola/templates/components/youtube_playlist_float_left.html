{% component youtube_playlist_float_left(list) -%}
<div class="youtube-float-left">
<iframe
src="https://www.youtube.com/embed/videoseries?list={{ list }}&loop=1&rel=0"
allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
allowfullscreen
></iframe>
</div>
{%- endcomponent youtube_playlist_float_left %}
