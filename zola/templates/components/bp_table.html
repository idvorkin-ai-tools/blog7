{% component bp_table(path, is) -%}
<table>
<tr>
{%- for i in is | split(pat=";") %}
<td>
<a
href="https://github.com/idvorkin/blob/raw/master/{{ path }}/{{ i | lower | trim }}"
class="glightbox"
>
<img
src="https://github.com/idvorkin/blob/raw/master/{{ path }}/{{ i | lower | trim }}"
/>
</a>
</td>
{%- endfor %}
</tr>
</table>
{%- endcomponent bp_table %}
