# Zola port of idvork.in (bead blog-pzp). Pinned to Zola 0.23.6: content is
# rendered as Tera 2 first, then Markdown, and Tera 2 is young — do not float.
#
# content/, static/ and data/ are GENERATED by build.sh from the Jekyll sources
# (convert.py, stage_static.py); Jekyll stays the source of truth until cutover.
base_url = "https://idvork.in"
title = ""
description = "Imagination Executed Sustainably"
compile_sass = false
build_search_index = false

# Root-level non-HTML outputs. Each name renders the template of the same name
# (templates/feed.xml, templates/search.json, ...), which pull the full page
# list with get_section rather than the date-only feed list.
generate_feeds = true
feed_filenames = [
  "feed.xml",
  "search.json",
  "search-titles.json",
  "search-pins.json",
]
# Dropped: links.jsonp (legacy JSONP of post titles; nothing in src/ or any
# page loads it, and Zola only loads templates with known extensions).
feed_limit = 20

# Jekyll has one /tags page with #anchors, not a page per tag.
taxonomies = [{ name = "tags", render = false }]

[markdown]
# kramdown's defaults: typographic quotes, -- / --- dashes, ellipsis.
smart_punctuation = true
bottom_footnotes = true
# No [markdown.highlighting]: code stays plain <pre><code class="language-x">
# (kramdown+rouge emitted class spans the site CSS barely styles).


[slugify]
# Every heading gets a pinned {#kramdown-slug} from convert.py, so this only
# matters for headings the converter could not see.
anchors = "on"
paths = "safe"
taxonomies = "safe"

[extra]
logo_png = "https://github.com/idvorkin/blob/raw/master/idvorkin-bunny-ears-ar-2020-547x400.png"
google_analytics = "UA-73602282-1"
siteurl = "https://idvork.in/"
search_exclude_permalinks = ["/changelog", "/positive-mitzvahs", "/negative-mitzvahs"]

[link_checker]
# Same-page anchors are checked by diff_sites.py against the real ids.
internal_level = "warn"
