# Zola spike (bead blog-pss). Throwaway: 15 posts, minimal layout, diffed
# against the Jekyll _site. Not wired into CI or the justfile.
base_url = "https://idvork.in"
title = ""
compile_sass = false
build_search_index = false
generate_feeds = false

taxonomies = [{ name = "tags" }]

[markdown]
# kramdown's defaults: typographic quotes, -- / --- dashes, ellipsis.
smart_punctuation = true
# Jekyll/kramdown footnotes render as a bottom list; Zola 0.19+ can do the same.
bottom_footnotes = true

[slugify]
# Only relevant when a heading has no pinned {#id}. See convert.py --pin-ids.
anchors = "on"
paths = "safe"

[extra]
logo_png = "https://github.com/idvorkin/blob/raw/master/idvorkin-bunny-ears-ar-2020-547x400.png"
google_analytics = true

[link_checker]
# Unpinned mode breaks TOC anchors; warn so the spike can still measure it.
internal_level = "warn"
