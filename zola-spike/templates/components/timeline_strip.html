{% component timeline_strip(items, caption=None, gallery="timeline") -%}
{#- ponytail: Liquid emitted this <style> once per page via a page-global flag; Tera 2 components are stateless, so it repeats per strip (harmless, ~1KB each). Upgrade: move .tl-strip CSS to assets/css. -#}
<style>
  .tl-strip {
    margin: 1.2em 0;
  }
  .tl-strip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: flex-start;
  }
  .tl-strip-item {
    flex: 1 1 110px;
    min-width: 110px;
    max-width: 220px;
    text-decoration: none;
    color: inherit;
    display: block;
  }
  .tl-strip-item img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 6px;
    border: 1px solid rgba(128, 128, 128, 0.35);
  }
  .tl-strip-cap {
    display: block;
    font-size: 0.72em;
    line-height: 1.25;
    opacity: 0.75;
    margin-top: 4px;
    text-align: center;
  }
  .tl-strip figcaption {
    font-size: 0.85em;
    font-style: italic;
    opacity: 0.75;
    margin-top: 8px;
  }
</style>
<figure class="tl-strip">
<div class="tl-strip-row">
{%- for it in items | split(pat=";") %}{% set p = it | split(pat="|") %}{% if p | length > 1 %}{% set src = p[0] | trim %}{% set cap = p[1] | trim %}{% set alt = (p[2] | trim) if p | length > 2 else "Timeline day-map — " ~ cap %}
<a
class="tl-strip-item glightbox"
href="/images/{{ src | escape_html }}"
data-gallery="{{ gallery }}"
data-description="{{ cap | escape_html }}"
>
<img
src="/images/{{ src | escape_html }}"
alt="{{ alt | escape_html }}"
loading="lazy"
/>
<span class="tl-strip-cap">{{ cap | escape_html }}</span>
</a>
{%- endif %}{% endfor %}
</div>
{%- if caption %}
<figcaption>{{ caption }}</figcaption>
{%- endif %}
</figure>
{%- endcomponent timeline_strip %}
