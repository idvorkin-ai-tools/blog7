{% component quote(text, author=None, url=None) -%}
<blockquote style="border-left: 4px solid #4a90d9; padding: 0.75em 1.25em; margin: 1.5em 0; background: rgba(74, 144, 217, 0.05); font-style: italic;">
{{ text }}{% if author %} <span style="font-style: normal; font-size: 0.9em; color: #666; white-space: nowrap;">— {% if url %}<a href="{{ url }}">{{ author }}</a>{% else %}{{ author }}{% endif %}</span>{% endif %}
</blockquote>
{%- endcomponent quote %}
